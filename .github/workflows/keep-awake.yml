# Keeps the database awake: Supabase's free plan pauses a project after about a
# week with no activity. This calls PRIME's health check once a day (free on
# GitHub). It can also be run by hand from the repo's Actions tab.
name: Keep the database awake

on:
  schedule:
    - cron: "17 6 * * *" # every day, 07:17 Lagos time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call PRIME's health check
        run: curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 https://cute-donut-7841cd.netlify.app/api/health
